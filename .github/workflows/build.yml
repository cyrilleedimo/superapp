# Compile et publie Ovia à chaque envoi sur main :
#   - tests du serveur PHP (comptes, commandes, paiement, messagerie…) ;
#   - APK Android (Android 12+) ;
#   - installeur Windows (Setup.exe, Inno Setup) ;
#   - application web ;
#   - paquet serveur prêt à déposer sur l'hébergeur (API PHP + application web) ;
#   - build iOS non signé (preuve de compilation ; l'App Store exige un compte Apple Developer) ;
#   - le tout attaché à une « Release » GitHub téléchargeable.
# Variables du dépôt (Settings → Secrets and variables → Actions → Variables), toutes facultatives :
#   API_URL      adresse https de l'API si différente de celle de server.json
#   APP_ORG      identifiant d'organisation, ex. com.monentreprise (défaut : app.ovia)
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.27.4'
  APP_VERSION: 1.1.${{ github.run_number }}

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, gd, sodium, curl, mbstring, exif
          coverage: none
      - name: Syntaxe PHP
        run: find server -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Tests de bout en bout (stockage fichier)
        run: php server/tests/run.php
      - name: Le schéma MySQL livré est à jour
        run: |
          php server/tools/dump-schema.php
          git diff --exit-code server/public/_ovia/schema.mysql.sql

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Générer le projet Android
        run: |
          flutter create --platforms=android --org "${{ vars.APP_ORG || 'app.ovia' }}" --project-name superapp .
          rm -f test/widget_test.dart   # test d'exemple du modèle Flutter (référence MyApp)
          python3 tool/patch_platforms.py "Ovia"
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - name: Analyse statique
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - name: Compiler l'APK
        # arm + arm64 seulement (tous les téléphones) : APK nettement plus léger à télécharger.
        run: flutter build apk --release --target-platform android-arm,android-arm64 --build-name "$APP_VERSION" --build-number "${{ github.run_number }}" --dart-define=API_URL="${{ vars.API_URL }}"
      - run: cp build/app/outputs/flutter-apk/app-release.apk "build/Ovia-$APP_VERSION.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: app/build/Ovia-*.apk

  windows:
    runs-on: windows-2022   # Visual Studio 2022, reconnu par Flutter 3.27
    defaults:
      run:
        working-directory: app
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Générer le projet Windows
        run: |
          flutter create --platforms=windows --org "${{ vars.APP_ORG || 'app.ovia' }}" --project-name superapp .
          Remove-Item test\widget_test.dart -ErrorAction SilentlyContinue
          python tool/patch_platforms.py "Ovia"
      - run: flutter pub get
      - run: dart run flutter_launcher_icons -f tool/icons_windows.yaml
      - name: Compiler l'app Windows
        run: flutter build windows --release --build-name "$env:APP_VERSION" --build-number "${{ github.run_number }}" --dart-define=API_URL="${{ vars.API_URL }}"
      - name: Embarquer le runtime Visual C++ (l'app démarre même sans redistribuable installé)
        run: |
          $dst = "build\windows\x64\runner\Release"
          foreach ($f in @("msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll")) {
            Copy-Item "C:\Windows\System32\$f" $dst -ErrorAction Stop
          }
      - name: Installer Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Construire l'installeur
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\setup.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: app/build/installer/*.exe

  # Application web + API PHP = un seul zip à extraire dans le dossier du sous-domaine.
  package:
    needs: [server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Compiler l'application web
        working-directory: app
        run: |
          flutter create --platforms=web --org "${{ vars.APP_ORG || 'app.ovia' }}" --project-name superapp .
          rm -f test/widget_test.dart
          python3 tool/patch_platforms.py "Ovia"
          flutter pub get
          dart run flutter_launcher_icons -f tool/icons_web.yaml
          # --no-web-resources-cdn : le moteur d'affichage est servi par notre hébergeur, pas par un CDN tiers.
          flutter build web --release --no-web-resources-cdn --build-name "$APP_VERSION" --build-number "${{ github.run_number }}"
      - name: Assembler le paquet serveur
        run: |
          mkdir -p paquet dist
          cp -a server/public/. paquet/
          cp -a app/build/web/. paquet/
          rm -f paquet/_ovia/config.php && rm -rf paquet/_ovia/data
          cp server/INSTALLATION.md paquet/_ovia/INSTALLATION.md
          test -f paquet/index.html && test -f paquet/.htaccess && test -f paquet/api/index.php && test -f paquet/_ovia/.htaccess
          (cd paquet && zip -qr "../dist/Ovia-serveur-$APP_VERSION.zip" .)
          unzip -l "dist/Ovia-serveur-$APP_VERSION.zip" | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: serveur
          path: dist/Ovia-serveur-*.zip

  ios:
    runs-on: macos-latest
    continue-on-error: true   # ne bloque jamais la publication des autres plateformes
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Générer le projet iOS
        run: |
          flutter create --platforms=ios --org "${{ vars.APP_ORG || 'app.ovia' }}" --project-name superapp .
          rm -f test/widget_test.dart
          python3 tool/patch_platforms.py "Ovia"
      - run: flutter pub get
      - run: dart run flutter_launcher_icons -f tool/icons_ios.yaml
      - name: Compiler pour iPhone (sans signature)
        run: flutter build ios --release --no-codesign --build-name "$APP_VERSION" --build-number "${{ github.run_number }}" --dart-define=API_URL="${{ vars.API_URL }}"
      - name: Emballer (non signé — à signer avec un compte Apple Developer avant toute installation)
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          (cd build/ipa && zip -qr "../Ovia-$APP_VERSION-ios-non-signe.ipa" Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: ios-non-signe
          path: app/build/Ovia-*-ios-non-signe.ipa

  release:
    needs: [server, android, windows, package, ios]
    if: ${{ !cancelled() && needs.android.result == 'success' && needs.windows.result == 'success' && needs.package.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Ovia ${{ env.APP_VERSION }}
          body: |
            Version compilée automatiquement.
            - **Android 12+** : télécharge le fichier `.apk` et ouvre-le sur le téléphone (autorise « sources inconnues »).
            - **Windows 10/11** : télécharge `Ovia-Setup-….exe` et lance l'installation.
            - **iPhone, Mac, tout navigateur** : ouvre l'adresse du site (application web), puis « Sur l'écran d'accueil ».
            - **Serveur** : `Ovia-serveur-….zip` s'extrait dans le dossier du sous-domaine chez l'hébergeur (guide : `_ovia/INSTALLATION.md`).
            - Le fichier `…-ios-non-signe.ipa` n'est pas installable tel quel : il sert pour la publication App Store (compte Apple Developer requis).
          files: dist/*
