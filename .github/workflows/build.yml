# Compile et publie l'app à chaque envoi sur main :
#   - tests du backend sur un vrai PostgreSQL ;
#   - APK Android (Android 12+) ;
#   - installeur Windows (Setup.exe, Inno Setup) ;
#   - le tout attaché à une « Release » GitHub téléchargeable.
# Variables du dépôt (Settings → Secrets and variables → Actions → Variables) :
#   API_URL      adresse https du serveur (facultatif : réglable aussi dans l'app)
#   APP_ORG      identifiant d'organisation Android, ex. com.monentreprise (défaut : app.ovia)
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.27.4'
  APP_VERSION: 1.0.${{ github.run_number }}

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: superapp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/superapp_test

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Générer le projet Android
        run: |
          flutter create --platforms=android --org "${{ vars.APP_ORG || 'app.ovia' }}" --project-name superapp .
          rm -f test/widget_test.dart   # test d'exemple du modèle Flutter (référence MyApp)
          python3 tool/patch_platforms.py "Ovia"
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - name: Analyse statique
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - name: Compiler l'APK
        run: flutter build apk --release --build-name "$APP_VERSION" --build-number "${{ github.run_number }}" --dart-define=API_URL="${{ vars.API_URL }}"
      - run: cp build/app/outputs/flutter-apk/app-release.apk "build/Ovia-$APP_VERSION.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: app/build/Ovia-*.apk

  windows:
    runs-on: windows-2022   # Visual Studio 2022, reconnu par Flutter 3.27
    defaults:
      run:
        working-directory: app
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Générer le projet Windows
        run: |
          flutter create --platforms=windows --org "${{ vars.APP_ORG || 'app.ovia' }}" --project-name superapp .
          Remove-Item test\widget_test.dart -ErrorAction SilentlyContinue
          python tool/patch_platforms.py "Ovia"
      - run: flutter pub get
      - run: dart run flutter_launcher_icons -f tool/icons_windows.yaml
      - name: Compiler l'app Windows
        run: flutter build windows --release --build-name "$env:APP_VERSION" --build-number "${{ github.run_number }}" --dart-define=API_URL="${{ vars.API_URL }}"
      - name: Embarquer le runtime Visual C++ (l'app démarre même sans redistribuable installé)
        run: |
          $dst = "build\windows\x64\runner\Release"
          foreach ($f in @("msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll")) {
            Copy-Item "C:\Windows\System32\$f" $dst -ErrorAction Stop
          }
      - name: Installer Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Construire l'installeur
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\setup.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: app/build/installer/*.exe

  release:
    needs: [backend, android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Ovia ${{ env.APP_VERSION }}
          body: |
            Version compilée automatiquement.
            - **Android 12+** : télécharge le fichier `.apk` et ouvre-le sur le téléphone (autorise « sources inconnues »).
            - **Windows 10/11** : télécharge `Ovia-Setup-….exe` et lance l'installation.
            Au premier lancement, si l'app demande l'adresse du serveur : écran de connexion → « Serveur ».
          files: dist/*
