name: superapp
description: Super-app — seconde main, trajets, repas, boutiques, voyages. Windows + Android 12+.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1       # état et injection de dépendances
  go_router: ^14.6.2             # navigation déclarative (deep links Android)
  dio: ^5.7.0                    # HTTP + intercepteurs (jetons, erreurs)
  flutter_secure_storage: ^9.2.2 # Keystore Android / DPAPI Windows
  url_launcher: ^6.3.1           # ouverture de la page de paiement hébergée
  google_fonts: ^6.2.1           # Bricolage Grotesque + Inter
  uuid: ^4.5.1                   # clés d'idempotence
  image_picker: ^1.1.2           # photos (galerie/caméra Android, sélecteur de fichiers Windows)
  flutter_map: ^7.0.2            # carte des courses (tuiles : [MAPS PROVIDER])
  latlong2: ^0.9.1
  geolocator: ^13.0.2            # position GPS (Android + Windows)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1  # génère les icônes Android (adaptatives) et Windows

flutter_launcher_icons:
  image_path: "assets/icon.png"
  android: true
  ios: false
  min_sdk_android: 31
  adaptive_icon_background: "#2B3CF0"
  adaptive_icon_foreground: "assets/icon_foreground.png"
  windows:
    generate: true
    image_path: "assets/icon.png"
    icon_size: 256

flutter:
  uses-material-design: true
  assets:
    - assets/ovia_lockup_dark.png
    - assets/ovia_lockup_light.png
    - assets/ovia_mark_dark.png
    - assets/ovia_mark_light.png
